name: Skill lint
'on':
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install -r requirements-validation.txt
      - name: Lint all skills
        run: python scripts/lint_skills.py
      - name: Verify lint catches invalid fixtures
        run: python -m unittest discover -s tests -v
